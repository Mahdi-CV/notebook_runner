  # --- PR verification (ROCm/gpuaidev-internal) ---------------------------
  # These two are under review (PR #99, #100). Their Docker images are NOT in
  # resolve_docker_image.py's known repos, so use the author-pinned tags below.

  inference/triton_inference_server_benchmark.ipynb:
    server: mi300x-primary
    hardware_required: [mi300x]
    gpus_required: 1

  inference/amd_comfyui_rocm_tutorial.ipynb:
    server: mi300x-primary
    hardware_required: [mi300x]
    gpus_required: 1
    expected_result: partial
    notes: >
      UNDER PR REVIEW (#100). Runs INSIDE the ComfyUI ROCm container.
      resolve_docker_image.py does not support this repo — use the author-pinned
      image exactly: rocm/comfyui:comfyui-0.18.2.amd0_rocm7.2.0_ubuntu24.04.
      COMFYUI_PATH is preset inside that image (typically /workload/ComfyUI).
      KNOWN GAP: the notebook depends on sibling workflows/*.json and
      assets/*.png that are NOT included in the PR (only the .ipynb was added) —
      cell 9 asserts the asset PNGs exist and will hard-fail without them.
      Model checkpoints (~10GB Hunyuan3D, ~17GB Wan2.2) are large; cells skip
      gracefully if absent (HUNYUAN_READY / WAN_I2V_READY flags) so the notebook
      can go green without generating anything — note that explicitly.
      Part 3 benchmarks default to RUN_BENCHMARKS=False (skipped by design).

