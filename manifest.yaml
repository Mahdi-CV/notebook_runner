    hardware_required: [mi300x]
    gpus_required: 8
    notes: >
      Runs two SGLang servers sequentially (baseline, then MTP-enabled).
      Stop the first server before starting the second.
      DeepSeek-V3 model is large — fail fast if disk space is low.

  inference/ocr_vllm.ipynb:
    skip: true
    skip_reason: >
      Gradio UI is the primary interface for this notebook and requires a browser.
      There are no testable inference cells outside the UI.

