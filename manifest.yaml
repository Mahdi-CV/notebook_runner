# Notebook test manifest
#
# Fields:
#   server           - named server from the `servers` block
#   hardware_required - GPU families this notebook explicitly targets
#   gpus_required    - number of GPUs the notebook requires
#   expected_result  - "partial" means partial counts as passing (for notebooks with untestable cells)
#   skip / skip_reason - skip entirely, with a mandatory reason
#   notes            - things the agent cannot learn from reading the notebook:
#                      external services that must be pre-running, known untestable cells,
#                      large model/disk warnings, special setup steps outside the notebook
#
# Docker image policy (applies to every notebook):
#   - rocm/pytorch notebooks  → resolve_docker_image(repo="rocm/pytorch", hardware=...)
#   - vLLM notebooks          → resolve_docker_image(repo="vllm/vllm-openai-rocm", hardware=...)
#   - SGLang notebooks        → resolve_docker_image(repo="lmsysorg/sglang", hardware=...)
#   Never use the tag written in the notebook. Always resolve the latest from Docker Hub.

# ---------------------------------------------------------------------------
# Servers
# ---------------------------------------------------------------------------
servers:
  mi300x-primary:
    hardware: mi300x

# ---------------------------------------------------------------------------
# Inference
# ---------------------------------------------------------------------------
notebooks:

  inference/1_inference_ver3_HF_transformers.ipynb:
