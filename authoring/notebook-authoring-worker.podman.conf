# Drop-in for notebook-authoring-worker.service on a rootless podman host
# (docker/README.md, "Rootless podman"): install as
#   /etc/systemd/system/notebook-authoring-worker.service.d/podman.conf
# with 189 replaced by the uid of the notebook-runner account.
[Unit]
Wants=user@189.service
After=user@189.service

[Service]
User=notebook-runner
Group=notebook-runner
SupplementaryGroups=
# The account's user session (lingering): podman places each container in its
# own systemd scope there, where CPU and memory limits are delegated.
Environment=HOME=/data/notebook-runner-home XDG_RUNTIME_DIR=/run/user/189 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/189/bus NBR_CONTAINER_CLI=podman
# Job containers belong to their own podman (conmon) processes, children of the
# worker: stopping the worker must not stop them.
KillMode=process
